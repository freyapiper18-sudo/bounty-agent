name: Bounty agent

on:
  schedule:
    - cron: "0 6,18 * * *"   # twice a day, UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no PRs or comments)"
        type: boolean
        default: true

concurrency:
  group: bounty-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Only run during the competition window (manual runs always allowed)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(date -u +%s)
          start=$(date -u -d "2026-10-01T00:00:00Z" +%s)
          end=$(date -u -d "2026-11-01T00:00:00Z" +%s)
          if [ "$now" -ge "$start" ] && [ "$now" -lt "$end" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.active == 'true'
        with:
          persist-credentials: false

      - name: Kill switch (a file called STOP in the repo halts the agent)
        if: steps.gate.outputs.active == 'true'
        id: stop
        run: |
          if [ -f STOP ]; then echo "halt=true" >> "$GITHUB_OUTPUT"; else echo "halt=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up git and gh as the bot account
        if: steps.gate.outputs.active == 'true' && steps.stop.outputs.halt == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          git config --global user.name "${{ vars.BOT_NAME }}"
          git config --global user.email "${{ vars.BOT_EMAIL }}"
          gh auth setup-git

      - name: Install Claude Code
        if: steps.gate.outputs.active == 'true' && steps.stop.outputs.halt == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the agent
        if: steps.gate.outputs.active == 'true' && steps.stop.outputs.halt == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          claude -p "Scheduled run at $(date -u +'%Y-%m-%d %H:%M UTC'). DRY_RUN=${DRY_RUN}. Follow CLAUDE.md exactly." \
            --max-turns 80 \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Save state and log
        if: always() && steps.gate.outputs.active == 'true' && steps.stop.outputs.halt == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          git add state.md log.md
          git commit -m "Agent run $(date -u +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push
